# 增强版完整编排：网盘 + 可选 Aria2，单独使用本文件。
# 源码目录：docker compose -f docker-compose.aria2.yml up -d --build
# 增强版安装包已将本文件作为 docker-compose.yml，无需额外 -f。
# 填写 FT_ARIA2_BLOCKED_NETWORKS，服务健康后在管理后台开启离线下载。
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: file-transfer:1.0
    container_name: file-transfer
    restart: unless-stopped
    env_file:
      # .env 不存在时也能起来（此时用镜像里的默认值）
      - path: .env
        required: false
    environment:
      FT_DATA_DIR: /app/data
      FT_WORKERS: ${FT_WORKERS:-4}
      FT_OFFLINE_DIR: /app/offline
      FT_ARIA2_RPC_URL: http://aria2:6800/jsonrpc
      FT_ARIA2_RPC_SECRET_FILE: /app/offline/control/rpc-secret
    ports:
      - "${FT_PORT:-8000}:8000"
    volumes:
      - ft-data:/app/data
      - ft-offline:/app/offline
    # 给正在传输的上传/下载留出收尾时间，避免重启时把大文件传输掐断
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  aria2:
    build:
      context: .
      dockerfile: docker/aria2/Dockerfile
      args:
        ARIA2_VERSION: ${FT_ARIA2_PACKAGE_VERSION:-1.37.0+debian-3}
    image: file-transfer-aria2:1.37.0
    restart: unless-stopped
    environment:
      FT_ARIA2_BT_PORT: ${FT_ARIA2_BT_PORT:-16881}
      # Include this site's / reverse proxy's own public IPs. Never expose RPC.
      FT_ARIA2_BLOCKED_NETWORKS: ${FT_ARIA2_BLOCKED_NETWORKS:-}
    ports:
      - "${FT_ARIA2_BT_PORT:-16881}:${FT_ARIA2_BT_PORT:-16881}/tcp"
      - "${FT_ARIA2_BT_PORT:-16881}:${FT_ARIA2_BT_PORT:-16881}/udp"
    volumes:
      - ft-offline:/downloads
      - ft-aria2-state:/state
    cap_drop:
      - ALL
    # Only initialization uses these; both runtime processes discard all caps.
    cap_add:
      - NET_ADMIN
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - SETPCAP
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ft-data:
  ft-offline:
  ft-aria2-state:

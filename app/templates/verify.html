{% extends "base.html" %}

{% block title %}邮箱验证 · {{ cfg.name }}{% endblock %}

{% block content %}
  <div class="auth-wrap">
    <div class="auth-card" style="text-align: center">
      <div
        class="mark"
        style="
          width: 52px; height: 52px; margin: 0 auto 16px; border-radius: 50%;
          display: grid; place-items: center;
          background: {{ 'var(--success-soft)' if success else 'var(--danger-soft)' }};
          color: {{ 'var(--success)' if success else 'var(--danger)' }};
        "
      >
        {{ icon('check', 26) if success else icon('x', 26) }}
      </div>

      <h1 style="font-size: 1.2rem">
        {{ '邮箱验证成功' if success else '验证失败' }}
      </h1>
      <p class="small muted">{{ message }}</p>

      <div class="row" style="justify-content: center; margin-top: 20px">
        {% if success %}
          <a class="btn btn-primary" href="/login">前往登录</a>
        {% else %}
          <a class="btn btn-primary" href="/login">返回登录</a>
        {% endif %}
      </div>
    </div>
  </div>
{% endblock %}

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>邮箱验证</title>
  </head>
  <body style="margin: 0; padding: 0; background: #f4f5f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background: #f4f5f7; padding: 32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 520px; background: #ffffff; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 12px rgba(16, 24, 40, 0.06);">
            <tr>
              <td style="padding: 30px 32px 8px;">
                <div style="font-size: 17px; font-weight: 700; color: #171a1f;">{{ site_name }}</div>
              </td>
            </tr>
            <tr>
              <td style="padding: 8px 32px 0;">
                <h1 style="margin: 12px 0 10px; font-size: 21px; font-weight: 680; color: #171a1f;">
                  验证你的邮箱
                </h1>
                <p style="margin: 0 0 8px; font-size: 15px; line-height: 1.7; color: #4a5261;">
                  你好，{{ username }}：
                </p>
                <p style="margin: 0 0 22px; font-size: 15px; line-height: 1.7; color: #4a5261;">
                  感谢注册「{{ site_name }}」。点击下面的按钮完成邮箱验证，之后即可登录并上传文件。
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 0 32px;">
                <a
                  href="{{ link }}"
                  style="display: inline-block; padding: 12px 30px; border-radius: 9px; background: #3563e9; color: #ffffff; font-size: 15px; font-weight: 600; text-decoration: none;"
                  >验证邮箱</a
                >
              </td>
            </tr>
            <tr>
              <td style="padding: 24px 32px 0;">
                <p style="margin: 0 0 8px; font-size: 13px; line-height: 1.7; color: #7b8494;">
                  如果按钮无法点击，请把下面的链接复制到浏览器打开：
                </p>
                <p style="margin: 0; font-size: 12px; line-height: 1.7; color: #3563e9; word-break: break-all;">
                  {{ link }}
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 22px 32px 30px;">
                <div style="border-top: 1px solid #e3e6ec; padding-top: 16px; font-size: 12.5px; line-height: 1.7; color: #7b8494;">
                  链接在 {% if ttl_minutes % 60 == 0 %}{{ ttl_minutes // 60 }} 小时{% else %}{{ ttl_minutes }} 分钟{% endif %}内有效，且只能使用一次。<br />
                  如果这不是你本人的操作，请忽略这封邮件。
                </div>
              </td>
            </tr>
          </table>
          <div style="max-width: 520px; margin: 16px auto 0; font-size: 12px; color: #9aa2b1; text-align: center;">
            此邮件由系统自动发送，请勿直接回复。
          </div>
        </td>
      </tr>
    </table>
  </body>
</html>
